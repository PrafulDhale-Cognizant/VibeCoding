services:
  mysql:
    image: mysql:8.4.10
    container_name: simplified-billing-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: billing
      MYSQL_USER: ${BILLING_DB_USERNAME:-billing_app}
      MYSQL_PASSWORD: ${BILLING_DB_PASSWORD:?Set BILLING_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${BILLING_DB_ROOT_PASSWORD:?Set BILLING_DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - billing-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  billing-mysql-data:
    name: simplified-billing-mysql-data
