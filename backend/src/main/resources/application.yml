spring:
  application:
    name: billing-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${BILLING_DB_URL:jdbc:mysql://127.0.0.1:3306/billing?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BILLING_DB_USERNAME:root}
    password: ${BILLING_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    create-schemas: false
    default-schema: billing
    schemas: billing
    locations: classpath:db/migration
    # Recovers databases that reached V10 while the corrected, rerunnable V9
    # was temporarily absent. It is harmless for clean, sequential installs.
    out-of-order: ${BILLING_FLYWAY_OUT_OF_ORDER:true}
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  address: ${BILLING_SERVER_ADDRESS:127.0.0.1}
  port: ${BILLING_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

billing:
  pos:
    prices-include-gst: ${BILLING_PRICES_INCLUDE_GST:true}
    round-payable: ${BILLING_ROUND_PAYABLE:true}
  security:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
      - billing://app
    jwt:
      issuer: ${BILLING_JWT_ISSUER:simplified-billing-desktop}
      secret-base64: ${BILLING_JWT_SECRET_BASE64:Y2hhbmdlLW1lLWJlZm9yZS1wcm9kdWN0aW9uLXNlY3JldC0zMmI=}
      access-token-ttl: ${BILLING_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${BILLING_REFRESH_TOKEN_TTL:7d}
    login:
      max-failed-attempts: 5
      lock-duration: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Offline billing and inventory backend

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  file:
    name: ${BILLING_LOG_FILE:logs/billing-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
